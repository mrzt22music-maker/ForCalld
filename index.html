<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ForCall — регистрация</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="shell">

  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 34 34" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="34" height="34" rx="10" fill="url(#g)"/>
      <path d="M10 13.5c0-1.9 1.6-3.5 3.5-3.5h1c.5 0 1 .3 1.2.8l1 2.3c.2.5.1 1-.3 1.4l-1 1c-.2.2-.2.5-.1.7.8 1.6 2.1 2.9 3.7 3.7.2.1.5.1.7-.1l1-1c.4-.4.9-.5 1.4-.3l2.3 1c.5.2.8.7.8 1.2v1c0 1.9-1.6 3.5-3.5 3.5-6.6 0-12-5.4-12-12z" fill="#14141F"/>
      <defs><linearGradient id="g" x1="0" y1="0" x2="34" y2="34"><stop stop-color="#8B93FF"/><stop offset="1" stop-color="#FFB65C"/></linearGradient></defs>
    </svg>
    <div class="brand-name">For<b>Call</b></div>
  </div>

  <svg class="hero-signal" viewBox="0 0 520 92" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <path id="waveA" d="M0 46 C 40 10, 80 82, 120 46 S 200 10, 240 46" stroke="#8B93FF" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <path id="waveB" d="M280 46 C 320 82, 360 10, 400 46 S 480 82, 520 46" stroke="#FFB65C" stroke-width="3" stroke-linecap="round" opacity="0.9"/>
    <circle cx="260" cy="46" r="5" fill="#F1F0FA">
      <animate attributeName="r" values="4;7;4" dur="2.2s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.2s" repeatCount="indefinite"/>
    </circle>
  </svg>

  <h1 style="font-size:26px; margin-bottom:6px;">Своя точка связи</h1>
  <p style="margin-bottom:24px;">Придумай юзернейм — по нему тебя будут находить для звонка. Никто, кроме тех, кому ты его дашь, не свяжется с тобой.</p>

  <div class="card">
    <form id="registerForm" novalidate>

      <div class="field">
        <label for="username">Юзернейм <span class="mono" style="color:var(--signal-text-dim)">(ID для звонка)</span></label>
        <input type="text" id="username" class="mono" placeholder="napr. aigerim_kz" required
               pattern="[a-z0-9_]{3,20}" title="только строчные латинские буквы, цифры и _, от 3 до 20 символов">
      </div>

      <div class="field">
        <label for="nickname">Никнейм <span style="color:var(--signal-text-dim)">(отображаемое имя)</span></label>
        <input type="text" id="nickname" placeholder="Как к тебе обращаться" required maxlength="30">
      </div>

      <div class="field">
        <label>Аватарка <span style="color:var(--signal-text-dim)">(необязательно)</span></label>
        <div class="avatar-row">
          <div class="avatar-preview" id="avatarPreview">?</div>
          <label class="avatar-upload">
            Загрузить фото
            <input type="file" id="avatarInput" accept="image/*">
          </label>
        </div>
      </div>

      <div class="field">
        <label for="language">Твой язык по умолчанию</label>
        <input type="text" id="language" list="langList" placeholder="Например: Қазақша" required>
        <datalist id="langList">
          <option value="Қазақша">
          <option value="Русский">
          <option value="English">
          <option value="Tagalog">
          <option value="Filipino">
        </datalist>
      </div>

      <button type="submit" class="btn btn-filled" id="submitBtn">
        <span class="material-symbols-outlined">person_add</span>
        Создать точку связи
      </button>
    </form>

    <div class="divider">уже есть точка связи?</div>
    <button class="btn btn-outlined" id="goCallBtn">
      <span class="material-symbols-outlined">call</span>
      Перейти к звонку
    </button>
  </div>

  <p class="footer-note">Данные хранятся в твоём Supabase-проекте.<br>Никто, включая ForCall, не имеет к ним доступа.</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script src="ripple.js"></script>
<script src="app-register.js"></script>
</body>
</html>
